name: Release

# Two ways to publish a release (either one builds and attaches the files):
#   1. Releases page -> Draft a new release -> pick any tag (0.3.0 or v0.3.0) -> Publish, or
#   2. Actions tab -> Release -> Run workflow, enter a version like 0.3.0.
# The in-app updater looks for exactly these two assets: Terrarium.exe and Terrarium.exe.sha256.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Work out version and tag
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
            $raw = $tag
          } else {
            $raw = "${{ inputs.version }}"
          }
          $v = $raw.Trim().TrimStart('v', 'V')
          if ($v -notmatch '^\d+\.\d+(\.\d+)?(-[0-9A-Za-z.-]+)?$') { throw "Not a version: $raw" }
          if (-not $tag) {
            # Reuse a release that already exists under either spelling; otherwise use v<version>.
            $tag = "v$v"
            foreach ($t in @("v$v", "$v")) { gh release view $t *> $null; if ($LASTEXITCODE -eq 0) { $tag = $t; break } }
          }
          $global:LASTEXITCODE = 0
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $v as $tag" 

      - name: Test core
        run: dotnet run --project tests/Terrarium.Core.Tests -c Release

      - name: Publish Terrarium.exe
        run: dotnet publish src/Terrarium.App/Terrarium.App.csproj -c Release -o out -p:Version=${{ steps.ver.outputs.version }}

      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/Terrarium.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path out/Terrarium.exe.sha256 -Value "$hash  Terrarium.exe" -Encoding ascii -NoNewline
          Get-Content out/Terrarium.exe.sha256

      - name: Publish to GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $files = @('out/Terrarium.exe', 'out/Terrarium.exe.sha256')
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Release already exists (e.g. made on the Releases page): attach or replace the build.
            gh release upload $tag @files --clobber
          } else {
            gh release create $tag @files --target "${{ github.sha }}" --title "Terrarium ${{ steps.ver.outputs.version }}" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed." }
