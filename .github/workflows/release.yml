name: Release

# Two ways to publish a release:
#   1. Actions tab -> Release -> Run workflow, enter a version like 0.2.0 (creates the tag for you), or
#   2. push a tag:  git tag v0.2.0 && git push origin v0.2.0
# The in-app updater looks for exactly these two assets: Terrarium.exe and Terrarium.exe.sha256.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read version from tag
        id: ver
        shell: pwsh
        run: |
          $raw = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.version }}" } else { "${{ github.ref_name }}" }
          $v = $raw.Trim().TrimStart('v')
          if ($v -notmatch '^\d+\.\d+(\.\d+)?(-[0-9A-Za-z.-]+)?$') { throw "Not a version: $raw" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Test core
        run: dotnet run --project tests/Terrarium.Core.Tests -c Release

      - name: Publish Terrarium.exe
        run: dotnet publish src/Terrarium.App/Terrarium.App.csproj -c Release -o out -p:Version=${{ steps.ver.outputs.version }}

      - name: Write checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash out/Terrarium.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path out/Terrarium.exe.sha256 -Value "$hash  Terrarium.exe" -Encoding ascii -NoNewline
          Get-Content out/Terrarium.exe.sha256

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ steps.ver.outputs.tag }}"
          out/Terrarium.exe out/Terrarium.exe.sha256
          --target "${{ github.sha }}"
          --title "Terrarium ${{ steps.ver.outputs.version }}"
          --generate-notes
